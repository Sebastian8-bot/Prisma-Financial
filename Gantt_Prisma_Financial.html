<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gantt Prisma Financial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: summary strip on top, then a planning board — sticky activity column on the left, a time scale (días / semanas / meses) scrolling to the right; edits in a side drawer. Phases are the four "spectrum" colors of the prism mark. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#131C33; --muted:#5A6479; --line:#E2E6EE; --line-strong:#C9D0DC; --weekend:#EEF1F6;
  --accent:#2F4BD6; --accent-soft:#E6EBFC;
  --p1:#25386F; --p2:#13839F; --p3:#D25E27; --p4:#3A8A55; --on-bar:#FFFFFF;
  --ok:#2E7D4F; --ok-bg:#E3F3E9; --warn:#946200; --warn-bg:#FCF1D6; --bad:#B42318; --bad-bg:#FDE6E4; --idle:#5A6479; --idle-bg:#EDF0F5;
  --today:#D2264B;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --labelw:290px; --rowh:52px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#151C2E; --ink:#E8ECF5; --muted:#9AA4BA; --line:#242D43; --line-strong:#34405C; --weekend:#111827;
  --accent:#8FA3FF; --accent-soft:#1F2948;
  --p1:#7E95E6; --p2:#3DB8D6; --p3:#F08D55; --p4:#62BE83; --on-bar:#0D1220;
  --ok:#6FD39A; --ok-bg:#163326; --warn:#F0C25A; --warn-bg:#352A10; --bad:#FF8A80; --bad-bg:#3A1A1A; --idle:#9AA4BA; --idle-bg:#20283B;
  --today:#FF6B88; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2E; --ink:#E8ECF5; --muted:#9AA4BA; --line:#242D43; --line-strong:#34405C; --weekend:#111827;
  --accent:#8FA3FF; --accent-soft:#1F2948;
  --p1:#7E95E6; --p2:#3DB8D6; --p3:#F08D55; --p4:#62BE83; --on-bar:#0D1220;
  --ok:#6FD39A; --ok-bg:#163326; --warn:#F0C25A; --warn-bg:#352A10; --bad:#FF8A80; --bad-bg:#3A1A1A; --idle:#9AA4BA; --idle-bg:#20283B;
  --today:#FF6B88; color-scheme:dark }
@media (max-width:640px){:root{--labelw:150px; --rowh:56px}}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.45}
.wrap{max-width:1400px; margin:0 auto; padding-inline:24px; padding-block:28px 48px; display:flex; flex-direction:column; gap:22px}
@media (max-width:640px){.wrap{padding-inline:16px; padding-block:18px 40px}}

header.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px}
.brand{display:flex; align-items:center; gap:14px; min-width:0}
.mark{width:44px; height:44px; flex:none}
.eyebrow{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
h1{font-family:var(--f-display); font-weight:700; font-size:clamp(24px,3.4vw,34px); line-height:1.05; margin:2px 0 0; text-wrap:balance; letter-spacing:-.01em}
.toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
label.inline{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
input,select,textarea{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:7px 10px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button{font:inherit; cursor:pointer}
.btn{background:var(--accent); color:var(--surface); border:0; border-radius:8px; padding:8px 14px; font-weight:600}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong)}
.btn.danger{background:transparent; color:var(--bad); border:1px solid var(--bad)}
.btn.danger.armed{background:var(--bad); color:var(--surface)}
.btn:disabled{opacity:.45; cursor:not-allowed}

.controls{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px}
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:9px; padding:3px; background:var(--surface); gap:2px}
.seg button{border:0; background:transparent; color:var(--muted); padding:6px 14px; border-radius:6px; font-weight:500; font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.ctl-left{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
.ctl-label{font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}

.summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.stat{background:var(--surface); padding:14px 16px; display:flex; flex-direction:column; gap:4px; min-width:0}
.stat .k{font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.stat .v{font-family:var(--f-display); font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.stat .s{font-size:12px; color:var(--muted)}
.meter{height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px}
.meter i{display:block; height:100%; background:var(--accent)}

.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:12.5px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.sw{width:12px; height:12px; border-radius:3px; display:inline-block; flex:none}
.hint{font-size:12.5px; color:var(--muted)}

.board{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.scroller{overflow-x:auto; overscroll-behavior-x:contain}
.grid{display:grid; grid-template-columns:var(--labelw) var(--tw); width:max-content; min-width:100%}
.corner,.lab{position:sticky; left:0; z-index:3; background:var(--surface); border-right:1px solid var(--line)}
.corner{display:flex; align-items:flex-end; padding:10px 14px; font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line-strong)}
.scale{position:relative; height:58px; border-bottom:1px solid var(--line-strong)}
.scale .r1,.scale .r2{position:absolute; left:0; right:0}
.scale .r1{top:0; height:28px}
.scale .r2{top:28px; height:30px}
.scale .c{position:absolute; top:0; bottom:0; border-left:1px solid var(--line); overflow:hidden; white-space:nowrap}
.r1 .c{font-family:var(--f-display); font-weight:500; font-size:13px; padding:7px 8px 0; text-transform:capitalize}
.r2 .c{font-family:var(--f-mono); font-size:10px; color:var(--muted); text-align:center; line-height:1.2; padding-top:3px}
.r2 .c b{display:block; font-weight:500; color:var(--ink); font-size:11px}
.r2 .c.we{background:var(--weekend)}
.r2 .c.now{background:var(--accent-soft)} .r2 .c.now b{color:var(--today)}
.r2.months .c{font-family:var(--f-display); font-size:13px; color:var(--ink); text-transform:capitalize; padding-top:7px; text-align:left; padding-left:8px}

.phase-l{padding:14px 14px 6px; display:flex; align-items:center; gap:8px; font-family:var(--f-mono); font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line)}
.lab.task{display:flex; flex-direction:column; justify-content:center; gap:2px; padding:6px 14px; min-height:var(--rowh); border-bottom:1px solid var(--line); text-align:left; border-top:0; border-left:0; font:inherit; color:inherit; width:100%; min-width:0}
.lab.task:hover{background:var(--accent-soft)}
.lab .n{font-weight:500; font-size:13.5px; line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.lab .m{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.trk{position:relative; min-height:var(--rowh); border-bottom:1px solid var(--line); background-repeat:repeat-x}
.trk.ph{min-height:0}
.today{position:absolute; top:0; bottom:0; width:2px; background:var(--today); opacity:.8; z-index:1; pointer-events:none}

.bar{position:absolute; top:12px; height:calc(var(--rowh) - 24px); border-radius:7px; background:var(--c); color:var(--on-bar);
  display:flex; align-items:center; padding:0 10px; font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; z-index:2;
  box-shadow:0 1px 0 rgba(0,0,0,.08); user-select:none; -webkit-user-select:none; min-width:6px}
.bar::before{content:""; position:absolute; top:0; bottom:0; right:0; width:calc(100% - var(--pg) * 1%); background:var(--surface); opacity:.38; pointer-events:none}
.bar span{position:relative; overflow:hidden; text-overflow:ellipsis}
.bar.done{opacity:.55}
.bar.late{outline:2px solid var(--bad); outline-offset:1px}
.bar.tiny{padding:0; justify-content:center}
.bar.tiny span{display:none}
.editable .bar{cursor:grab; touch-action:none}
.editable .bar.dragging{cursor:grabbing; box-shadow:0 6px 18px rgba(0,0,0,.22); z-index:4}
.handle{position:absolute; right:0; top:0; bottom:0; width:12px; cursor:ew-resize}
.handle::after{content:""; position:absolute; right:4px; top:30%; bottom:30%; width:2px; border-radius:1px; background:var(--on-bar); opacity:.6}
.readonly .handle{display:none}
.tip{position:fixed; z-index:15; pointer-events:none; background:var(--ink); color:var(--surface); font-family:var(--f-mono); font-size:12px; padding:6px 10px; border-radius:6px; white-space:nowrap}
.chip{display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px; vertical-align:1px}
.st-Pendiente{color:var(--idle); background:var(--idle-bg)} .st-En{color:var(--warn); background:var(--warn-bg)}
.st-Terminada{color:var(--ok); background:var(--ok-bg)} .st-Atrasada{color:var(--bad); background:var(--bad-bg)}

.empty{padding:40px 20px; text-align:center; color:var(--muted)}
.empty strong{display:block; color:var(--ink); font-family:var(--f-display); font-size:18px; margin-bottom:6px}

.panel{position:fixed; top:0; right:0; bottom:0; width:min(400px,100%); background:var(--surface); border-left:1px solid var(--line-strong);
  box-shadow:-12px 0 40px rgba(0,0,0,.18); z-index:20; display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
.panel header{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line)}
.panel h2{font-family:var(--f-display); font-size:18px; margin:0}
.panel .body{padding:18px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; flex:1}
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field>span{font-size:12px; color:var(--muted); font-weight:500}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.dates{font-family:var(--f-mono); font-size:12.5px; background:var(--bg); border-radius:8px; padding:10px 12px; color:var(--muted)}
.dates b{color:var(--ink); font-weight:500}
.panel footer{display:flex; justify-content:space-between; gap:10px; padding:14px 20px; border-top:1px solid var(--line)}
.x{background:none; border:0; font-size:22px; line-height:1; color:var(--muted); padding:4px 8px}
input[type=range]{padding:0; border:0; accent-color:var(--accent)}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px; font-size:13px; z-index:30; max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 44 44" aria-hidden="true">
        <path d="M4 36 L18 8 L32 36 Z" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M2 24 L14 22" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
        <path d="M24 20 L42 13" stroke="var(--p1)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M25 22.5 L42 19" stroke="var(--p2)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M26 25 L42 25" stroke="var(--p3)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M27 27.5 L42 31" stroke="var(--p4)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="eyebrow">Plan de puesta en marcha · 6 meses</div>
        <h1>Prisma Financial</h1>
      </div>
    </div>
    <div class="toolbar">
      <label class="inline" for="projstart">Inicio del proyecto <input type="date" id="projstart"></label>
      <button class="btn ghost" id="reset" type="button" hidden>Restablecer plan</button>
      <button class="btn" id="add" type="button">Agregar actividad</button>
    </div>
  </header>

  <section class="summary" id="summary" aria-label="Resumen"></section>

  <div class="controls">
    <div class="ctl-left">
      <span class="ctl-label">Escala</span>
      <div class="seg" role="group" aria-label="Escala de tiempo">
        <button type="button" data-zoom="dia" aria-pressed="false">Días</button>
        <button type="button" data-zoom="semana" aria-pressed="true">Semanas</button>
        <button type="button" data-zoom="mes" aria-pressed="false">Meses</button>
      </div>
      <button class="btn ghost" id="gotoday" type="button">Ir a hoy</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="hint" id="hint">Arrastra una barra para moverla, tira de su borde derecho para alargarla, o toca una actividad para editarla.</div>

  <section class="board" aria-label="Carta Gantt">
    <div class="scroller" id="scroller"><div id="gantt"></div></div>
  </section>
</div>

<aside class="panel" id="panel" hidden aria-label="Editar actividad">
  <header><h2 id="p-title">Editar actividad</h2><button class="x" id="p-close" type="button" aria-label="Cerrar">×</button></header>
  <div class="body">
    <label class="field"><span>Actividad</span><input id="f-name" type="text"></label>
    <div class="row2">
      <label class="field"><span>Fase</span><select id="f-phase"></select></label>
      <label class="field"><span>Responsable</span><input id="f-owner" type="text" placeholder="Sin asignar"></label>
    </div>
    <div class="row2">
      <label class="field"><span>Fecha de inicio</span><input id="f-from" type="date"></label>
      <label class="field"><span>Fecha de término</span><input id="f-to" type="date"></label>
    </div>
    <div class="dates" id="f-dates"></div>
    <div class="row2">
      <label class="field"><span>Estado</span><select id="f-status"></select></label>
      <label class="field"><span>Avance <b id="f-pgv">0%</b></span><input id="f-progress" type="range" min="0" max="100" step="5"></label>
    </div>
    <label class="field"><span>Notas y dependencias</span><textarea id="f-notes" rows="4"></textarea></label>
  </div>
  <footer><button class="btn danger" id="p-del" type="button">Eliminar</button><button class="btn ghost" id="p-done" type="button">Listo</button></footer>
</aside>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const PHASES={estructura:{label:'Estructura',c:'var(--p1)'},lineas:{label:'Líneas de negocio',c:'var(--p2)'},marca:{label:'Marca y difusión',c:'var(--p3)'},evaluacion:{label:'Evaluación',c:'var(--p4)'}};
const PORDER=Object.keys(PHASES);
const STATUS=['Pendiente','En curso','Terminada','Atrasada'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['D','L','M','M','J','V','S'];
const ZOOMS={dia:{ppd:30,snap:1},semana:{ppd:6,snap:7},mes:{ppd:3.2,snap:7}};
let db=null, canWrite=false, loaded=false, tasks=[], startISO='2026-10-12', editingId=null, drag=null, pendingRender=false;
let zoom='semana';try{const z=localStorage.getItem('prisma-gantt-zoom');if(ZOOMS[z])zoom=z}catch(e){}
const $=id=>document.getElementById(id);
const DAY=864e5;

function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function diffDays(a,b){return Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/DAY)}
function fmt(d){return d.getDate()+' '+MES[d.getMonth()]}
function fmtY(d){return d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear()}
function dayDate(n){return addDays(parseISO(startISO),n)}
function tStart(t){return dayDate(t.d0)}
function tEnd(t){return dayDate(t.d0+t.days-1)}
function ppd(){const p=ZOOMS[zoom].ppd;return innerWidth<640?p*0.85:p}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function durTxt(days){return days<14?days+' d':(Math.round(days/7*2)/2).toString().replace('.',',')+' sem'}
/* older records used weeks (start, dur); convert them to days on the fly */
function norm(t){
  let d0=t.d0, days=t.days;
  if(d0===undefined||days===undefined){const s=Math.max(1,Math.round(+t.start||1)),w=Math.max(1,Math.round(+t.dur||1));d0=(s-1)*7;days=w*7-2}
  return {...t,d0:Math.max(0,Math.round(+d0||0)),days:Math.max(1,Math.round(+days||1)),progress:Math.min(100,Math.max(0,+t.progress||0)),status:STATUS.includes(t.status)?t.status:'Pendiente',phase:PHASES[t.phase]?t.phase:'estructura'}
}
function toast(msg){const el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200)}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}

function renderLegend(){$('legend').innerHTML=PORDER.map(k=>`<span><i class="sw" style="background:${PHASES[k].c}"></i>${PHASES[k].label}</span>`).join('')+`<span><i class="sw" style="background:var(--today);width:3px"></i>Hoy</span>`}

function renderSummary(){
  const s=$('summary');
  if(!tasks.length){s.innerHTML=`<div class="stat"><span class="k">Inicio</span><span class="v">${fmtY(parseISO(startISO))}</span><span class="s">Sin actividades todavía</span></div>`;return}
  const st=parseISO(startISO), td=today();
  const end=dayDate(Math.max(...tasks.map(t=>t.d0+t.days-1)));
  const tw=tasks.reduce((a,t)=>a+t.days,0), pg=Math.round(tasks.reduce((a,t)=>a+t.days*(t.status==='Terminada'?100:t.progress),0)/tw);
  const cnt=Object.fromEntries(STATUS.map(x=>[x,tasks.filter(t=>t.status===x).length]));
  let clock;
  if(td<st){const d=diffDays(st,td);clock=`<span class="v">${d} días</span><span class="s">para el inicio</span>`}
  else if(td>end){clock=`<span class="v">Cerrado</span><span class="s">El plan terminó el ${fmtY(end)}</span>`}
  else{const w=Math.floor(diffDays(td,st)/7)+1, tot=Math.ceil((diffDays(end,st)+1)/7);clock=`<span class="v">Semana ${w}</span><span class="s">de ${tot}</span>`}
  const next=tasks.filter(t=>t.status!=='Terminada'&&tStart(t)>=td).sort((a,b)=>a.d0-b.d0)[0];
  s.innerHTML=`
   <div class="stat"><span class="k">Inicio → fin estimado</span><span class="v">${fmt(st)} → ${fmt(end)}</span><span class="s">${st.getFullYear()} – ${end.getFullYear()} · ${diffDays(end,st)+1} días</span></div>
   <div class="stat"><span class="k">Reloj del plan</span>${clock}</div>
   <div class="stat"><span class="k">Avance ponderado</span><span class="v">${pg}%</span><div class="meter"><i style="width:${pg}%"></i></div></div>
   <div class="stat"><span class="k">Actividades</span><span class="v">${tasks.length}</span><span class="s">${cnt['Terminada']} terminadas · ${cnt['En curso']} en curso${cnt['Atrasada']?` · <b style="color:var(--bad)">${cnt['Atrasada']} atrasadas</b>`:''}</span></div>
   <div class="stat"><span class="k">Próximo inicio</span>${next?`<span class="v" style="font-size:17px;line-height:1.2">${esc(next.name)}</span><span class="s">${fmtY(tStart(next))}</span>`:'<span class="v">—</span><span class="s">Nada pendiente por iniciar</span>'}</div>`;
}

function scaleHTML(N,p){
  const st=parseISO(startISO), td=today(), tOff=diffDays(td,st);
  const months=[];let cur=null;
  for(let i=0;i<N;i++){const d=addDays(st,i),k=d.getFullYear()*12+d.getMonth();if(!cur||cur.k!==k){cur={k,d,i,n:0};months.push(cur)}cur.n++}
  const cell=(i,n,inner,cls='',title='')=>`<div class="c ${cls}" style="left:${(i*p).toFixed(1)}px;width:${(n*p).toFixed(1)}px"${title?` title="${title}"`:''}>${inner}</div>`;
  if(zoom==='mes'){
    const years=[];let y=null;
    for(const m of months){const yy=m.d.getFullYear();if(!y||y.y!==yy){y={y:yy,i:m.i,n:0};years.push(y)}y.n+=m.n}
    return `<div class="r1">${years.map(y=>cell(y.i,y.n,y.y)).join('')}</div><div class="r2 months">${months.map(m=>cell(m.i,m.n,m.n*p>60?MESL[m.d.getMonth()]:MES[m.d.getMonth()])).join('')}</div>`;
  }
  const r1=months.map(m=>cell(m.i,m.n,m.n*p>70?MESL[m.d.getMonth()]+' '+m.d.getFullYear():MES[m.d.getMonth()],'',MESL[m.d.getMonth()]+' '+m.d.getFullYear())).join('');
  let r2='';
  if(zoom==='dia'){
    for(let i=0;i<N;i++){const d=addDays(st,i),dw=d.getDay();r2+=cell(i,1,`<b>${d.getDate()}</b>${DIA[dw]}`,(dw===0||dw===6?'we ':'')+(i===tOff?'now':''))}
  }else{
    for(let i=0,w=1;i<N;i+=7,w++){const d=addDays(st,i);r2+=cell(i,Math.min(7,N-i),`<b>S${w}</b>${fmt(d)}`,(tOff>=i&&tOff<i+7)?'now':'')}
  }
  return `<div class="r1">${r1}</div><div class="r2">${r2}</div>`;
}

function trackBg(p){
  const st=parseISO(startISO);
  if(zoom==='dia'){
    const sat=(6-st.getDay()+7)%7;
    return `background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to right,var(--weekend) ${2*p}px,transparent ${2*p}px);background-size:${p}px 100%,${7*p}px 100%;background-position:0 0,${sat*p}px 0`;
  }
  return `background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:${7*p}px 100%`;
}

function render(){
  if(drag){pendingRender=true;return}
  tasks=tasks.map(norm);
  renderSummary();
  document.querySelectorAll('[data-zoom]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.zoom===zoom)));
  const g=$('gantt');
  if(!db&&loaded){g.innerHTML=`<div class="empty"><strong>No se pudo abrir el plan</strong>Inicia sesión en claude.ai para ver y editar la carta Gantt.</div>`;return}
  if(!loaded){g.innerHTML=`<div class="empty"><strong>Cargando el plan…</strong>Las actividades aparecerán aquí.</div>`;return}
  if(!tasks.length){g.innerHTML=`<div class="empty"><strong>Aún no hay actividades</strong>Agrega la primera con el botón «Agregar actividad».</div>`;return}
  const p=ppd();
  let N=Math.max(182,...tasks.map(t=>t.d0+t.days))+7;N=Math.ceil(N/7)*7;
  const st=parseISO(startISO), td=today(), tOff=diffDays(td,st);
  const todayEl=(tOff>=0&&tOff<N)?`<div class="today" style="left:${((tOff+0.5)*p).toFixed(1)}px"></div>`:'';
  const bg=trackBg(p);
  let h=`<div class="grid ${canWrite?'editable':'readonly'}" style="--tw:${(N*p).toFixed(0)}px">`;
  h+=`<div class="corner">Actividad</div><div class="scale">${scaleHTML(N,p)}</div>`;
  for(const ph of PORDER){
    const list=tasks.filter(t=>t.phase===ph).sort((a,b)=>a.d0-b.d0||(a.order??0)-(b.order??0));
    if(!list.length)continue;
    h+=`<div class="lab phase-l"><i class="sw" style="background:${PHASES[ph].c}"></i>${PHASES[ph].label}</div><div class="trk ph" style="${bg}">${todayEl}</div>`;
    for(const t of list){
      const late=t.status!=='Terminada'&&tEnd(t)<td;
      const w=t.days*p-2, tiny=w<34;
      h+=`<button class="lab task" type="button" data-open="${t.id}"><span class="n">${esc(t.name)}</span><span class="m"><span class="chip st-${t.status.split(' ')[0]}">${t.status}</span> ${fmt(tStart(t))} – ${fmt(tEnd(t))}${t.owner?' · '+esc(t.owner):''}</span></button>`;
      h+=`<div class="trk" style="${bg}">${todayEl}<div class="bar ${t.status==='Terminada'?'done':''} ${late||t.status==='Atrasada'?'late':''} ${tiny?'tiny':''}" data-id="${t.id}" style="--c:${PHASES[t.phase].c};--pg:${t.status==='Terminada'?100:t.progress};left:${(t.d0*p+1).toFixed(1)}px;width:${Math.max(6,w).toFixed(1)}px" title="${esc(t.name)} · ${fmt(tStart(t))} – ${fmt(tEnd(t))} (${durTxt(t.days)})"><span>${zoom==='dia'&&w>160?esc(t.name)+' · ':''}${durTxt(t.days)}${t.progress&&w>90?' · '+t.progress+'%':''}</span><i class="handle" data-handle="1"></i></div></div>`;
    }
  }
  h+=`</div>`;
  g.innerHTML=h;
  if(editingId)fillPanel(false);
}

/* ---------- zoom ---------- */
function setZoom(z){
  if(!ZOOMS[z]||z===zoom)return;
  const sc=$('scroller'), lw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--labelw'))||0;
  const leftDay=sc.scrollLeft/ppd();
  zoom=z;try{localStorage.setItem('prisma-gantt-zoom',z)}catch(e){}
  render();sc.scrollLeft=leftDay*ppd();
}
document.querySelectorAll('[data-zoom]').forEach(b=>b.addEventListener('click',()=>setZoom(b.dataset.zoom)));
$('gotoday').onclick=()=>{
  const off=diffDays(today(),parseISO(startISO));
  if(off<0){$('scroller').scrollTo({left:0,behavior:'smooth'});toast('El plan aún no comienza: te muestro el inicio.');return}
  $('scroller').scrollTo({left:Math.max(0,(off-2)*ppd()),behavior:'smooth'});
};

/* ---------- writes ---------- */
const chains={};
function writeTask(id,patch){
  if(!db||!canWrite)return;
  const ref=db.doc('tasks/'+id);
  chains[id]=(chains[id]||Promise.resolve()).then(()=>ref.update(patch)).catch(e=>{
    if(e&&e.code==='invalid_argument'){canWrite=false;applyWriteState();toast('No tienes permiso para editar este plan.')}
    else toast('No se pudo guardar el cambio. Revisa tu conexión e inténtalo de nuevo.');
  });
}
function patchLocal(id,patch){const t=tasks.find(x=>x.id===id);if(t)Object.assign(t,patch)}

/* ---------- drag ---------- */
const tip=$('tip');
$('gantt').addEventListener('pointerdown',e=>{
  const bar=e.target.closest('.bar');if(!bar||!canWrite)return;
  const t=tasks.find(x=>x.id===bar.dataset.id);if(!t)return;
  e.preventDefault();bar.setPointerCapture(e.pointerId);
  drag={bar,t,mode:e.target.dataset.handle?'resize':'move',x0:e.clientX,a0:t.d0,b0:t.days,na:t.d0,nb:t.days,moved:false,id:e.pointerId};
  bar.classList.add('dragging');
});
$('gantt').addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x0;if(Math.abs(dx)>4)drag.moved=true;
  const sn=ZOOMS[zoom].snap, dd=Math.round(dx/ppd()/sn)*sn, p=ppd();
  if(drag.mode==='move'){drag.na=Math.max(0,drag.a0+dd);drag.nb=drag.b0}else{drag.nb=Math.max(1,drag.b0+dd);drag.na=drag.a0}
  drag.bar.style.left=(drag.na*p+1)+'px';drag.bar.style.width=Math.max(6,drag.nb*p-2)+'px';
  if(drag.moved){tip.hidden=false;tip.textContent=`${fmt(dayDate(drag.na))} – ${fmt(dayDate(drag.na+drag.nb-1))} · ${durTxt(drag.nb)}`;
    tip.style.left=Math.min(innerWidth-200,e.clientX+12)+'px';tip.style.top=(e.clientY-38)+'px'}
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;d.bar.classList.remove('dragging');tip.hidden=true;
  if(!d.moved){render();openPanel(d.t.id);return}
  if(d.na!==d.a0||d.nb!==d.b0){const p={d0:d.na,days:d.nb};patchLocal(d.t.id,p);writeTask(d.t.id,p)}
  pendingRender=false;render();
}
$('gantt').addEventListener('pointerup',endDrag);
$('gantt').addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id){drag=null;tip.hidden=true;render()}});
$('gantt').addEventListener('click',e=>{
  const b=e.target.closest('[data-open]');if(b){openPanel(b.dataset.open);return}
  if(!canWrite){const bar=e.target.closest('.bar');if(bar)openPanel(bar.dataset.id)}
});

/* ---------- panel ---------- */

function openPanel(id){editingId=id;$('p-del').classList.remove('armed');$('p-del').textContent='Eliminar';fillPanel(true);$('panel').hidden=false;if(canWrite)setTimeout(()=>$('f-name').focus(),30)}
function closePanel(){editingId=null;$('panel').hidden=true}
function fillPanel(force){
  const t=tasks.find(x=>x.id===editingId);if(!t){closePanel();return}
  const map={'f-name':t.name||'','f-phase':t.phase,'f-owner':t.owner||'','f-from':toISO(tStart(t)),'f-to':toISO(tEnd(t)),'f-status':t.status,'f-progress':t.status==='Terminada'?100:t.progress,'f-notes':t.notes||''};
  for(const [k,v] of Object.entries(map)){const el=$(k);if(force||document.activeElement!==el)el.value=v;el.disabled=!canWrite}
  $('f-from').min=startISO;$('f-to').min=toISO(tStart(t));
  $('f-pgv').textContent=(t.status==='Terminada'?100:t.progress)+'%';
  const s=tStart(t),en=tEnd(t);let wd=0;for(let i=0;i<t.days;i++){const dw=addDays(s,i).getDay();if(dw!==0&&dw!==6)wd++}
  $('f-dates').innerHTML=`<b>${t.days} días</b> corridos · <b>${wd}</b> hábiles<br>Semana ${Math.floor(t.d0/7)+1} a ${Math.floor((t.d0+t.days-1)/7)+1} del plan`;
  $('p-title').textContent=canWrite?'Editar actividad':'Actividad';
  $('p-del').hidden=!canWrite;
}

function commit(p){patchLocal(editingId,p);writeTask(editingId,p);render()}
function bind(id,field,conv){
  $(id).addEventListener('change',()=>{if(!editingId)return;const v=conv($(id).value);const p={[field]:v};

    if(field==='progress'&&v===100){const t=tasks.find(x=>x.id===editingId);if(t&&t.status!=='Terminada')p.status='Terminada'}
    commit(p)});
}

  const b=$('p-del');if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmar eliminación';return}
  const id=editingId;closePanel();tasks=tasks.filter(t=>t.id!==id);render();

  if(!db||!canWrite)return;
  const ref=db.collection('tasks').doc();

  tasks.push({id:ref.id,...t});render();openPanel(ref.id);

$('projstart').addEventListener('change',async()=>{
  const v=$('projstart').value;if(!v||!db||!canWrite)return;
  startISO=v;render();

});

function applyWriteState(){
  $('add').disabled=!canWrite;$('projstart').disabled=!canWrite;
  $('hint').textContent=canWrite?'Arrastra una barra para moverla, tira de su borde derecho para alargarla, o toca una actividad para editarla. En la escala de días las barras se mueven día a día; en semanas y meses, de a una semana.'+(LOCAL?' Los cambios se guardan en este navegador.':''):'Vista de solo lectura. Toca una actividad para ver su detalle.';
  render();
}

let LOCAL=false;
function makeLocalDb(seed){
  const KEY='prisma-gantt-v2';let state=null;
  try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!state||!state.tasks)state=JSON.parse(JSON.stringify(seed));
  const subs={tasks:[],config:[]};
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
  const emitT=()=>{const snap={docs:Object.entries(state.tasks).map(([id,d])=>({id,exists:true,data:()=>d}))};subs.tasks.forEach(f=>f(snap))};
  const emitC=()=>{const snap={exists:true,data:()=>state.config};subs.config.forEach(f=>f(snap))};
  const docRef=path=>{const [c,id]=path.split('/');const emit=()=>c==='tasks'?emitT():emitC();return{id,
    set:async d=>{if(c==='tasks')state.tasks[id]={...d};else state.config={...d};save();emit()},
    update:async d=>{if(c==='tasks')state.tasks[id]={...state.tasks[id],...d};else Object.assign(state.config,d);save();emit()},
    delete:async()=>{delete state.tasks[id];save();emitT()},
    onSnapshot:f=>{subs.config.push(f);setTimeout(emitC);return()=>{}}}};
  return{doc:docRef,collection:()=>({doc:id=>docRef('tasks/'+(id||('t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)))),onSnapshot:f=>{subs.tasks.push(f);setTimeout(emitT);return()=>{}}}),
    reset:()=>{try{localStorage.removeItem(KEY)}catch(e){};location.reload()}};
}
